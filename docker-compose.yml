services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LIVE_GEMINI_API_KEY: ${LIVE_GEMINI_API_KEY:-}
      GEMINI_API_BASE: ${GEMINI_API_BASE:-https://generativelanguage.googleapis.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ENABLE_MCP_STDIO: ${ENABLE_MCP_STDIO:-false}
      ENABLE_MCP_PRIVATE_HTTP: ${ENABLE_MCP_PRIVATE_HTTP:-false}
      ENABLE_THIRD_PARTY_PRIVATE_HTTP: ${ENABLE_THIRD_PARTY_PRIVATE_HTTP:-false}
      ENABLE_LIVE_WS_PROXY: ${ENABLE_LIVE_WS_PROXY:-true}
      LIVE_WS_IDLE_TIMEOUT_MS: ${LIVE_WS_IDLE_TIMEOUT_MS:-300000}
      SERVER_KEY_PRIORITY: ${SERVER_KEY_PRIORITY:-false}
      THIRD_PARTY_ROUTES: ${THIRD_PARTY_ROUTES:-}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      SERVER_ACCESS_TOKEN: ${SERVER_ACCESS_TOKEN:-}
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    environment:
      RUNTIME_SERVER_MANAGED_API: ${RUNTIME_SERVER_MANAGED_API:-true}
      RUNTIME_SERVER_ACCESS_PASSWORD: ${RUNTIME_SERVER_ACCESS_PASSWORD:-}
      RUNTIME_USE_CUSTOM_API_CONFIG: ${RUNTIME_USE_CUSTOM_API_CONFIG:-true}
      RUNTIME_USE_API_PROXY: ${RUNTIME_USE_API_PROXY:-true}
      RUNTIME_API_PROXY_URL: ${RUNTIME_API_PROXY_URL:-/api/gemini}
      RUNTIME_LIVE_API_BASE_URL: ${RUNTIME_LIVE_API_BASE_URL:-/api/live}
      RUNTIME_THIRD_PARTY_PROXY_URL: ${RUNTIME_THIRD_PARTY_PROXY_URL:-/api/openai}
      RUNTIME_PYODIDE_BASE_URL: ${RUNTIME_PYODIDE_BASE_URL:-}
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:80/healthz').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
